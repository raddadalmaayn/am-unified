# NOTE: the IP addresses in the SANS entries below are RFC 5737
# documentation PLACEHOLDER addresses (192.0.2.11-.14 for D1-D4).
# Replace them with your own node addresses before running cryptogen,
# or peers reached by IP will fail TLS hostname verification.
OrdererOrgs:
  - Name: Orderer
    Domain: example.com
    EnableNodeOUs: true
    Specs:
      - Hostname: orderer
        SANS:
          - localhost
          - orderer.example.com
          - 192.0.2.14

PeerOrgs:
  - Name: Org1
    Domain: org1.example.com
    EnableNodeOUs: true
    Template:
      Count: 1
      SANS:
        - localhost
        - peer0.org1.example.com
        - 192.0.2.11
    Users:
      Count: 1

  - Name: Org2
    Domain: org2.example.com
    EnableNodeOUs: true
    Template:
      Count: 1
      SANS:
        - localhost
        - peer0.org2.example.com
        - 192.0.2.12
    Users:
      Count: 1

  - Name: Org3
    Domain: org3.example.com
    EnableNodeOUs: true
    Template:
      Count: 1
      SANS:
        - localhost
        - peer0.org3.example.com
        - 192.0.2.13
    Users:
      Count: 1

  - Name: Org4
    Domain: org4.example.com
    EnableNodeOUs: true
    Template:
      Count: 1
      SANS:
        - localhost
        - peer0.org4.example.com
        - 192.0.2.14
    Users:
      Count: 1
